<!DOCTYPE html>
<html lang="en">

<head>

    <!-- SETS UP THE PAGE -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Favorites</title>


    <!-- STYLING FOR THIS PAGE -->
    <style>

        /* REMOVES DEFAULT PAGE SPACING */

        * {
            box-sizing: border-box;
        }


        /* CENTERS THE FAVORITES HEADING ON THE PAGE */

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;
        }


        /* POSITIONS THE BACK BUTTON IN THE TOP LEFT */

        .back-button {
            position: absolute;

            top: 30px;
            left: 30px;

            padding: 10px 18px;

            background-color: white;
            color: #0647f5;

            border: 2px solid #0647f5;
            border-radius: 8px;

            font-size: 16px;
            text-decoration: none;

            cursor: pointer;

            transition: 0.2s ease;
        }


        /* FILLS THE BACK BUTTON BLUE WHEN HOVERED */

        .back-button:hover {
            background-color: #0647f5;
            color: white;
        }


        /* CONTROLS THE CENTERED FAVORITES HEADING */

        h1 {
            margin: 0;
            text-align: center;
        }

    </style>

</head>


<body>


    <!-- TAKES THE USER BACK TO THE MAIN INDEX PAGE -->

    <a href="index.html" class="back-button">
        ← Back
    </a>


    <!-- CENTERED FAVORITES PAGE HEADING -->

    <h1>My Favorites:</h1>


</body>

</html>
